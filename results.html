<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Skills Advisor,  Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- EmailJS SDK — used by js/email.js to send the results copy -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="ember-field" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="index.html"><span class="mark"></span> Soft Skills Advisor</a>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="quiz.html">Quiz</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container-fluid" style="max-width:1080px;">
  <p class="eyebrow">Results for <span id="studentNameOut"></span> · <span id="studentIdOut"></span></p>
  <h1>Your soft skills profile</h1>

  <div class="results-grid">
    <div class="card">
      <h2>Overall score: <span id="overallScore" class="score-value"></span></h2>
      <p class="text-dim" id="overallComment"></p>
      <div id="scoreBreakdown" class="stack mt-2"></div>
      <div class="recommend-box" id="recommendations"></div>
      <p class="text-dim mt-2" id="emailStatus" role="status"></p>
    </div>
    <div class="card center">
      <h2>Category radar</h2>
      <canvas id="resultsChart" width="480" height="480" aria-label="Radar chart of category scores" role="img"></canvas>
    </div>
  </div>

  <div class="mt-2">
    <button type="button" class="btn btn-ghost" id="retakeBtn">Retake the quiz</button>
    <a href="contact.html" class="btn btn-primary">Send feedback</a>
  </div>
</main>

<footer class="site-footer">
  © 2026 Soft Skills Advisor · Results are stored only for this browser session
</footer>

<script src="js/quiz-data.js"></script>
<script src="js/canvas.js"></script>
<script src="js/email.js"></script>
<script src="js/results.js"></script>
</body>
</html>
