<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Skills Advisor. Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ember-field" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="index.html"><span class="mark"></span> Soft Skills Advisor</a>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="quiz.html" class="active">Quiz</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container-fluid" style="max-width:900px;">
  <div class="quiz-topbar">
    <div class="progress-track" aria-label="Quiz progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">Question 1 of 10</span>
    <span class="timer-display" id="timerDisplay" role="timer" aria-live="polite">30:00</span>
  </div>

  <section class="card quiz-card" id="quizCard" aria-live="polite">
    <!-- populated by js/quiz.js -->
  </section>

  <div class="quiz-nav">
    <button type="button" class="btn btn-ghost" id="prevBtn">← Back</button>
    <button type="button" class="btn btn-primary" id="nextBtn" disabled>Next</button>
  </div>
</main>

<footer class="site-footer">
  © 2026 Soft Skills Advisor · Your progress is saved locally for this session only
</footer>

<script src="js/validation.js"></script>
<script src="js/timer.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/main.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
